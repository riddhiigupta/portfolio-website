<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entering...</title>

  <!-- preload solar-system assets so they're cached by the time we exit the wormhole -->
  <link rel="prefetch" href="home.html" as="document">
  <link rel="preload" href="models/sun.glb" as="fetch" crossorigin>
  <link rel="preload" href="models/planet1.glb" as="fetch" crossorigin>
  <link rel="preload" href="models/planet2.glb" as="fetch" crossorigin>
  <link rel="preload" href="models/planet3.glb" as="fetch" crossorigin>
  <link rel="preload" href="models/planet4.glb" as="fetch" crossorigin>
  <link rel="preload" href="models/planet5.glb" as="fetch" crossorigin>
  <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    #tunnel { position: fixed; inset: 0; z-index: 0; }

    /* tunnel walls darken the edges — you're inside */
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent          28%,
        rgba(0, 0, 6,  0.18) 50%,
        rgba(0, 0, 8,  0.65) 74%,
        rgba(0, 0, 0,  0.97) 100%
      );
    }

    /* ── shared card base ── */
    .worm-card {
      position: fixed;
      top: 50%;
      z-index: 4;
      width: 540px;
      height: 410px;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      overflow: hidden;
    }
    .worm-card.visible  { opacity: 0.78; }
    .worm-card.receding { opacity: 0;    transition: opacity 0.6s ease; }

    .worm-card img {
      position: absolute;
      width: 138%;
      height: 116%;
      top: -8%;
      object-fit: cover;
      filter: brightness(0.72) saturate(0.52) contrast(1.08);
    }

    .card-right {
      right: 260px;
      transform: translateY(-50%) perspective(300px) rotateY(-32deg) skewY(6deg);
    }
    .card-right img { left: -6%; }

    .card-left {
      left: 260px;
      transform: translateY(-50%) perspective(300px) rotateY(32deg) skewY(-6deg);
    }
    .card-left img { right: -6%; left: auto; }

    /* vertical offsets — staggered so cards don't all sit on the same line */
    #c1 { top: 37%; }   /* right — above centre */
    #c2 { top: 57%; }   /* left  — below centre */
    #c3 { top: 55%; }   /* right — below centre */
    #c4 { top: 36%; }   /* left  — above centre */
    #c5 { top: 41%; }   /* right — slightly above */

    /* per-card object-position fine-tuning */
    #c1 img { object-position: 30% 20%; }   /* Elon — face left-center */
    #c2 img { object-position: 62% 30%; }   /* Hackathon — people right-center */
    #c3 img { object-position: 48% 28%; }   /* C00 — center */
    #c4 img { object-position: 58% 14%; }   /* Steve Jobs — face upper-right */
    #c5 img { object-position: 38% 28%; }   /* AMD — Riddhi center of group */

    /* tunnel exit — burst to white like you punched through the end */
    #fadeout {
      position: fixed; inset: 0; z-index: 200;
      background: radial-gradient(ellipse at center,
        #ffffff 0%, #d8eeff 40%, #a0ccff 70%, #6aabff 100%
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s ease-in;
    }
    #fadeout.go { opacity: 1; }
    /* ════════════════════════════════════════════════════════
       MOBILE-ONLY OVERRIDES — desktop wormhole untouched above
       ════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .worm-card {
        width: 38vw;
        height: 28vw;
      }
      .card-right {
        right: 4vw;
        transform: translateY(-50%) perspective(180px) rotateY(-20deg) skewY(4deg);
      }
      .card-left {
        left: 4vw;
        transform: translateY(-50%) perspective(180px) rotateY(20deg) skewY(-4deg);
      }
    }
  </style>
</head>
<body>

<canvas id="tunnel"></canvas>
<div class="vignette"></div>

<!-- RIGHT: 1 Elon, 3 C00, 5 AMD -->
<div class="worm-card card-right" id="c1"><img src="images/elon.jpeg"      alt="Elon Musk"></div>
<div class="worm-card card-right" id="c3"><img src="images/c00.jpeg"       alt=""></div>
<div class="worm-card card-right" id="c5"><img src="images/amd.jpeg"       alt="AMD"></div>

<!-- LEFT: 2 Hackathon, 4 Steve Jobs -->
<div class="worm-card card-left"  id="c2"><img src="images/hackathon.jpeg" alt="Hackathon"></div>
<div class="worm-card card-left"  id="c4"><img src="images/stevejobs.jpeg" alt="Steve Jobs"></div>

<div id="fadeout"></div>

<script>
const canvas = document.getElementById('tunnel');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

/* ══════════════════════════════════════════════════════
   STREAKS
══════════════════════════════════════════════════════ */
function makeStreak() {
  const t = Math.random();
  return {
    angle: Math.random() * Math.PI * 2,
    dist:  Math.random() * 320,
    speed: 30 + Math.random() * 58,
    len:   90 + Math.random() * 250,
    w:     0.28 + Math.random() * 1.9,
    col:   t > 0.93 ? [140, 200, 255]
         : t > 0.79 ? [200, 230, 255]
         : [255, 255, 255],
    alpha: 0.12 + Math.random() * 0.38,
  };
}

const streaks = Array.from({ length: 920 }, makeStreak);
const rings   = [];
let   ringTimer = 0;
function spawnRing() { rings.push({ r: 60, speed: 10, alpha: 0.72 }); }

/* ══════════════════════════════════════════════════════
   ENTRY PHASE — tunnel mouth rushes at you
══════════════════════════════════════════════════════ */
const ENTRY_MS = 520;
const entryT0  = Date.now();

function drawEntry() {
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const maxD = Math.hypot(cx, cy);
  const raw  = (Date.now() - entryT0) / ENTRY_MS;
  const t    = Math.min(raw, 1);

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  const portalR = maxD * 1.55 * Math.pow(t, 0.7);
  const portalA = Math.max(0, 1 - t * 1.45);

  if (portalR > 0) {
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, portalR);
    grd.addColorStop(0,    `rgba(255,255,255,${portalA * 0.92})`);
    grd.addColorStop(0.08, `rgba(225,238,255,${portalA * 0.78})`);
    grd.addColorStop(0.28, `rgba(175,210,255,${portalA * 0.45})`);
    grd.addColorStop(0.6,  `rgba(100,160,255,${portalA * 0.18})`);
    grd.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);
  }

  for (let i = 0; i < 14; i++) {
    const rt = (t * 1.4 + i * (1 / 14)) % 1;
    const rr = rt * maxD * 1.5;
    const ra = Math.sin(rt * Math.PI) * (0.95 - t * 0.4);
    if (ra <= 0 || rr <= 0) continue;
    ctx.save();
    ctx.strokeStyle = `rgba(220,238,255,${ra})`;
    ctx.lineWidth   = Math.max(0.5, 3.5 * (1 - rt * 0.85));
    ctx.beginPath();
    ctx.ellipse(cx, cy, rr * 2.15, rr, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  if (raw < 1) { requestAnimationFrame(drawEntry); }
  else         { drawFrame(); }
}

/* ══════════════════════════════════════════════════════
   HYPERSPACE LOOP
══════════════════════════════════════════════════════ */
function drawFrame() {
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const maxD = Math.hypot(cx, cy) + 100;

  ctx.fillStyle = 'rgba(0,0,0,0.36)';
  ctx.fillRect(0, 0, w, h);

  for (const s of streaks) {
    s.dist += s.speed;
    if (s.dist > maxD) {
      s.dist  = 1 + Math.random() * 22;
      s.angle = Math.random() * Math.PI * 2;
      s.speed = 30 + Math.random() * 58;
      s.len   = 90 + Math.random() * 250;
    }
    const d0 = Math.max(0, s.dist - s.len);
    const x0 = cx + Math.cos(s.angle) * d0;
    const y0 = cy + Math.sin(s.angle) * d0;
    const x1 = cx + Math.cos(s.angle) * s.dist;
    const y1 = cy + Math.sin(s.angle) * s.dist;
    const gr = ctx.createLinearGradient(x0, y0, x1, y1);
    const [r, g, b] = s.col;
    gr.addColorStop(0, `rgba(${r},${g},${b},0)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},${s.alpha})`);
    ctx.save();
    ctx.strokeStyle = gr;
    ctx.lineWidth   = s.w * (0.32 + s.dist / maxD * 1.45);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.restore();
  }

  ringTimer++;
  if (ringTimer % 11 === 0) spawnRing();
  for (let i = rings.length - 1; i >= 0; i--) {
    const rg = rings[i];
    rg.r     += rg.speed;
    rg.speed *= 1.07;
    rg.alpha -= 0.015;
    if (rg.alpha <= 0) { rings.splice(i, 1); continue; }
    ctx.save();
    ctx.strokeStyle = `rgba(180,210,255,${rg.alpha * 0.55})`;
    ctx.lineWidth   = 1.8;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rg.r * 2.1, rg.r, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  requestAnimationFrame(drawFrame);
}

requestAnimationFrame(drawEntry);

/* ══════════════════════════════════════════════════════
   GLIMPSE SEQUENCE — 6 cards, fast cross-fade
   New card starts exactly as previous begins fading out.
   FADE = CSS transition duration (0.38s → 380ms)
   HOLD = time each card stays fully visible
   CYCLE = FADE + HOLD  (next card starts every CYCLE ms)
══════════════════════════════════════════════════════ */
const FADE  = 600;
const HOLD  = 280;
const CYCLE = FADE + HOLD;   /* 880ms per card */

/* sequence in display order: c1→c2→c3→c4→c5 */
const SEQ = ['c1','c2','c3','c4','c5'];
const T0  = ENTRY_MS + 80;   /* first card appears just after entry (600ms) */

/* if user navigated here via back button, don't auto-redirect — let them
   press back again to reach the landing page. tunnel keeps animating. */
const navEntries = performance.getEntriesByType('navigation');
const navType = navEntries.length ? navEntries[0].type : 'navigate';

if (navType !== 'back_forward') {
  SEQ.forEach((id, i) => {
    const el = document.getElementById(id);
    setTimeout(() => el.classList.add('visible'), T0 + i * CYCLE);
    setTimeout(() => {
      el.classList.remove('visible');
      el.classList.add('receding');
    }, T0 + (i + 1) * CYCLE);
  });

  /* exit: last card fades out + small buffer, then white burst */
  const T_EXIT = T0 + SEQ.length * CYCLE + 400;
  setTimeout(() => {
    document.getElementById('fadeout').classList.add('go');
    setTimeout(() => { window.location.href = 'home.html'; }, 800);
  }, T_EXIT);
}
</script>
</body>
</html>
